{% extends 'base.html' %}
{% block title %}登录 - 校园活动平台{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h2 class="auth-title"><i class="bi bi-person-check" style="color:var(--accent2);margin-right:.4rem;"></i>欢迎回来</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">用户名</label>
        <input type="text" name="username" id="id_username" class="form-control" placeholder="请输入用户名" required autofocus>
      </div>
      <div class="form-group">
        <label for="id_password">密码</label>
        <input type="password" name="password" id="id_password" class="form-control" placeholder="请输入密码" required>
      </div>
      {% if form.errors %}
        <div class="alert alert-error" style="margin-bottom:1rem;">用户名或密码错误，请重试。</div>
      {% endif %}
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:.5rem;">登 录</button>
    </form>
    <p class="auth-footer">还没有账号？<a href="{% url 'users:register' %}">立即注册</a></p>
  </div>
</div>
{% endblock %}
